<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <h1>Tasks</h1>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="Add a task" aria-label="New task" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <nav id="filters" class="filters" aria-label="Filter tasks">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </nav>

    <ul id="task-list" class="task-list"></ul>

    <footer class="footer">
      <span id="task-count"></span>
      <button id="clear-done" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="index.js"></script>
</body>

</html>
